name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: swift test
      - name: Test HTTPS mock concurrency
        run: python3 -B -m unittest discover -s scripts -p test_mock_relay.py -v
      - name: Test secure relay transport
        run: make test-relay
      - name: Build app bundle
        run: make app
